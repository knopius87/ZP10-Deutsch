<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZP10 Deutsch – Lernapp NRW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple: #534AB7;
    --purple-light: #EEEDFE;
    --purple-dark: #3C3489;
    --teal: #1D9E75;
    --teal-light: #E1F5EE;
    --teal-dark: #085041;
    --amber: #BA7517;
    --amber-light: #FAEEDA;
    --gray-50: #F8F7F4;
    --gray-100: #EFEDE8;
    --gray-200: #D3D1C7;
    --gray-600: #5F5E5A;
    --gray-900: #1A1917;
    --text: #1A1917;
    --text-muted: #5F5E5A;
    --text-hint: #888780;
    --border: rgba(0,0,0,0.1);
    --border-hover: rgba(0,0,0,0.2);
    --bg: #F8F7F4;
    --surface: #FFFFFF;
    --radius: 12px;
    --radius-sm: 8px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── HEADER ── */
  .site-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .site-logo {
    width: 38px; height: 38px;
    background: var(--purple);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: white;
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    flex-shrink: 0;
  }
  .site-header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    font-weight: 400;
    color: var(--text);
  }
  .site-header h1 span {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--purple);
    background: var(--purple-light);
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 8px;
    vertical-align: middle;
  }

  /* ── LAYOUT ── */
  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* ── TYPE SELECTOR ── */
  .selector-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-hint);
    margin-bottom: 10px;
  }
  .type-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 24px;
  }
  @media (max-width: 500px) { .type-grid { grid-template-columns: 1fr; } }
  .type-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .type-btn:hover { border-color: var(--border-hover); }
  .type-btn.active {
    border: 2px solid var(--purple);
    background: var(--purple-light);
  }
  .type-btn .tb-tag {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--purple);
    margin-bottom: 4px;
  }
  .type-btn .tb-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.3;
  }
  .type-btn .tb-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  /* ── MAIN CARD ── */
  .main-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .card-top {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .card-top h2 {
    font-family: 'DM Serif Display', serif;
    font-size: 17px;
    font-weight: 400;
    margin-bottom: 10px;
  }
  .prog-row {
    display: flex; align-items: center; gap: 10px;
  }
  .prog-bar {
    flex: 1; height: 5px;
    background: var(--gray-100);
    border-radius: 3px; overflow: hidden;
  }
  .prog-fill {
    height: 100%; background: var(--purple);
    border-radius: 3px; transition: width 0.4s ease;
  }
  .prog-text {
    font-size: 12px; color: var(--text-muted);
    white-space: nowrap;
  }

  /* ── STEPS ── */
  .steps { padding: 12px 16px; }
  .step {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 8px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .step.done { border-color: #9FE1CB; background: var(--teal-light); }
  .step-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
  }
  .step-num {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--gray-100);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500;
    color: var(--text-muted);
    flex-shrink: 0;
    transition: background 0.2s, color 0.2s;
  }
  .step.done .step-num {
    background: var(--teal); color: white;
    font-size: 14px;
  }
  .step-title {
    flex: 1; font-size: 14px; font-weight: 500;
    color: var(--text); line-height: 1.35;
  }
  .step.done .step-title { color: var(--teal-dark); }
  .step-arrow {
    font-size: 11px; color: var(--text-hint);
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .step.open .step-arrow { transform: rotate(180deg); }

  .step-body {
    display: none;
    padding: 0 14px 14px 50px;
    border-top: 1px solid var(--border);
  }
  .step.open .step-body { display: block; }
  .step-body p {
    font-size: 13px; color: var(--text-muted);
    line-height: 1.65; margin: 10px 0 6px;
  }
  .step-body ul {
    font-size: 13px; color: var(--text-muted);
    line-height: 1.75; padding-left: 18px; margin-bottom: 6px;
  }
  .step-body li { margin-bottom: 2px; }
  .step-body strong { font-weight: 500; color: var(--text); }
  .step-body em { color: var(--text); font-style: italic; }

  .btn-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .btn-done {
    background: transparent;
    border: 1px solid #1D9E75;
    color: var(--teal-dark);
    border-radius: var(--radius-sm);
    padding: 6px 14px; font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-done:hover { background: var(--teal-light); }
  .btn-ki {
    background: transparent;
    border: 1px solid var(--border-hover);
    color: var(--text-muted);
    border-radius: var(--radius-sm);
    padding: 6px 14px; font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-ki:hover { background: var(--gray-100); }

  /* ── KI BOX ── */
  .ki-box {
    margin-top: 12px;
    background: var(--gray-50);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
  }
  .ki-label {
    font-size: 12px; font-weight: 500;
    color: var(--text-muted); margin-bottom: 7px;
  }
  .ki-box textarea {
    width: 100%;
    border: 1px solid var(--border-hover);
    border-radius: var(--radius-sm);
    padding: 9px 11px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    background: var(--surface);
    color: var(--text);
    resize: vertical; min-height: 72px;
    line-height: 1.55;
  }
  .ki-box textarea:focus { outline: none; border-color: var(--purple); }
  .btn-send {
    margin-top: 8px;
    background: var(--purple);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    padding: 7px 16px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-send:hover { background: var(--purple-dark); }
  .btn-send:disabled { opacity: 0.5; cursor: default; }
  .ki-result {
    margin-top: 10px;
    font-size: 13px; line-height: 1.65;
    color: var(--text);
    padding: 10px 12px;
    background: white;
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--purple);
  }
  .ki-loading {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--text-muted);
    margin-top: 10px;
  }
  .dots span {
    display: inline-block; width: 5px; height: 5px;
    background: var(--purple); border-radius: 50%;
    margin: 0 2px;
    animation: bounce 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* ── CARD FOOTER ── */
  .card-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex; align-items: center;
    justify-content: space-between; gap: 10px;
    flex-wrap: wrap;
  }
  .footer-score { font-size: 13px; color: var(--text-muted); }
  .footer-score strong { color: var(--text); }
  .btn-reset {
    background: transparent;
    border: 1px solid var(--border-hover);
    color: var(--text-muted);
    border-radius: var(--radius-sm);
    padding: 6px 14px; font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer; transition: background 0.15s;
  }
  .btn-reset:hover { background: var(--gray-100); }

  /* ── FOOTER ── */
  .page-footer {
    text-align: center;
    padding: 32px 20px 20px;
    font-size: 12px;
    color: var(--text-hint);
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="site-logo">D</div>
  <h1>ZP10 Deutsch <span>NRW · Klasse 10</span></h1>
</header>

<div class="container">
  <p class="selector-label">Aufgabentyp wählen</p>
  <div class="type-grid">
    <button class="type-btn active" onclick="selectType('prosa')" id="btn-prosa">
      <div class="tb-tag">Aufgabentyp 4a</div>
      <div class="tb-name">Prosatext analysieren</div>
      <div class="tb-desc">Kurzgeschichte, Erzählung</div>
    </button>
    <button class="type-btn" onclick="selectType('lyrik')" id="btn-lyrik">
      <div class="tb-tag">Aufgabentyp 4a</div>
      <div class="tb-name">Gedicht analysieren</div>
      <div class="tb-desc">Lyrik, lyrisches Ich</div>
    </button>
    <button class="type-btn" onclick="selectType('typ2')" id="btn-typ2">
      <div class="tb-tag">Aufgabentyp 2</div>
      <div class="tb-name">Informierenden Text verfassen</div>
      <div class="tb-desc">Materialgestützt schreiben</div>
    </button>
    <button class="type-btn" onclick="selectType('typ4b')" id="btn-typ4b">
      <div class="tb-tag">Aufgabentyp 4b</div>
      <div class="tb-name">Vergleichen &amp; Bewerten</div>
      <div class="tb-desc">Texte analysieren, Stellung nehmen</div>
    </button>
  </div>

  <div class="main-card">
    <div class="card-top">
      <h2 id="card-title"></h2>
      <div class="prog-row">
        <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
        <span class="prog-text" id="prog-text"></span>
      </div>
    </div>
    <div class="steps" id="steps-container"></div>
    <div class="card-footer">
      <span class="footer-score" id="footer-score"></span>
      <button class="btn-reset" onclick="resetAll()">Neu starten</button>
    </div>
  </div>
</div>

<footer class="page-footer">ZP10 Deutsch Lernapp · Gymnasium NRW · Klasse 10</footer>

let current = 'prosa';
let state = {};
let openIdx = null;

function initState(type) {
  state = {};
  openIdx = null;
  TYPES[type].steps.forEach((_, i) => {
    state[i] = { done: false, kiOpen: false, kiText: '', kiResult: '', loading: false };
  });
}

function selectType(type) {
  current = type;
  ['prosa','lyrik','typ2','typ4b'].forEach(t => {
    document.getElementById('btn-'+t).classList.toggle('active', t === type);
  });
  initState(type);
  render();
}

function toggleStep(i) {
  openIdx = (openIdx === i) ? null : i;
  render();
}

function markDone(i) {
  state[i].done = !state[i].done;
  render();
}

function toggleKI(i) {
  state[i].kiOpen = !state[i].kiOpen;
  render();
}

async function sendKI(i) {
  const ta = document.getElementById('ki-ta-'+i);
  if (!ta) return;
  const userText = ta.value.trim();
  if (!userText) { ta.focus(); return; }
  state[i].kiText = userText;
  state[i].loading = true;
  state[i].kiResult = '';
  render();

  const step = TYPES[current].steps[i];
  const typeTitle = TYPES[current].title;

  const prompt = `Du bist ein erfahrener Deutschlehrer am Gymnasium NRW, Klasse 10 (ZP10-Vorbereitung). Du gibst konstruktives, ermutigendes Feedback.

Aufgabentyp: ${typeTitle}
Schritt ${i+1}: "${step.title}"

Die Schülerin/der Schüler schreibt:
"${userText}"

Gib ein konkretes Feedback auf Deutsch (max. 4–5 Sätze):
1. Beginne mit dem, was gut gelungen ist
2. Gib genau einen konkreten Verbesserungshinweis (falls nötig)
3. Schließe mit einem kurzen Motivationssatz

Wichtig: Sei klar, konkret und freundlich. Kein Markdown, keine Aufzählungen, kein Fettdruck.`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }]
      })
    });
    const data = await res.json();
    state[i].kiResult = data.content.map(c => c.text || '').join('');
  } catch(e) {
    state[i].kiResult = "Verbindung fehlgeschlagen. Bitte lade die Seite neu und versuche es erneut.";
  }
  state[i].loading = false;
  render();
  setTimeout(() => {
    const el = document.getElementById('ki-result-'+i);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 100);
}

function resetAll() {
  initState(current);
  render();
}

function render() {
  const type = TYPES[current];
  document.getElementById('card-title').textContent = type.title;
  const done = Object.values(state).filter(s => s.done).length;
  const total = type.steps.length;
  document.getElementById('prog-fill').style.width = Math.round(done/total*100) + '%';
  document.getElementById('prog-text').textContent = done + ' / ' + total + ' erledigt';
  document.getElementById('footer-score').innerHTML = '<strong>' + done + ' von ' + total + '</strong> Schritten abgeschlossen';

  document.getElementById('steps-container').innerHTML = type.steps.map((step, i) => {
    const s = state[i];
    const isOpen = openIdx === i;
    return `<div class="step${s.done?' done':''}${isOpen?' open':''}">
      <div class="step-head" onclick="toggleStep(${i})">
        <div class="step-num">${s.done ? '✓' : (i+1)}</div>
        <div class="step-title">Schritt ${i+1}: ${step.title}</div>
        <div class="step-arrow">▼</div>
      </div>
      <div class="step-body">
        ${step.body}
        <div class="btn-row">
          <button class="btn-done" onclick="event.stopPropagation();markDone(${i})">${s.done ? 'Als offen markieren' : 'Als erledigt markieren'}</button>
          <button class="btn-ki" onclick="event.stopPropagation();toggleKI(${i})">${s.kiOpen ? 'KI-Feedback ausblenden' : 'KI-Feedback einholen'}</button>
        </div>
        ${s.kiOpen ? `<div class="ki-box">
          <div class="ki-label">${step.kiLabel}</div>
          <textarea id="ki-ta-${i}" placeholder="Schreibe hier deine Antwort ...">${s.kiText ? s.kiText : ''}</textarea>
          <button class="btn-send" onclick="event.stopPropagation();sendKI(${i})" ${s.loading?'disabled':''}>
            ${s.loading ? 'KI denkt nach ...' : 'Feedback erhalten →'}
          </button>
          ${s.loading ? `<div class="ki-loading"><span>KI antwortet</span><span class="dots"><span></span><span></span><span></span></span></div>` : ''}
          ${s.kiResult ? `<div class="ki-result" id="ki-result-${i}">${s.kiResult}</div>` : ''}
        </div>` : ''}
      </div>
    </div>`;
  }).join('');
}

initState('prosa');
render();
</script>
